<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Планувальник раціону</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12"></script>
  <style>
    :root { --ink:#14302b; --accent:#1f6f63; --bg:#f3f7f6; --hi:#b3382c; --mid:#c98a1b; --lo:#4a9a6b; }
    body { font-family: Onest, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    .card { border: 1px solid #d5e2df; border-radius: .5rem; }
    .btn-primary { background: var(--accent); border-color: var(--accent); }
    .urg { height: 8px; background: #e3ece9; border-radius: 4px; overflow: hidden; margin-bottom: 2px; }
    .urg-bar { height: 100%; }
    .urg-bar.hi { background: var(--hi); } .urg-bar.mid { background: var(--mid); } .urg-bar.lo { background: var(--lo); }
    th { font-weight: 600; font-size: .85rem; color: #4d6660; }
  </style>
</head>
<body>
<main class="container py-4" style="max-width: 980px">
  <h1 class="h3 mb-1">Планувальник раціону</h1>
  <p class="text-muted mb-4">Облік продуктів, нечітка оцінка терміновості та план харчування на тиждень.</p>

  <section class="card p-3 mb-4">
    <h2 class="h6 mb-3">Додати продукт</h2>
    <form class="row g-2" hx-post="/products" hx-target="#products" hx-on::after-request="this.reset()">
      <div class="col-md-4"><label class="form-label small">Назва</label><input name="name" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label small">Тип</label>
        <select id="category" name="category" class="form-select">
          {% for category in category_options %}
          <option value="{{ category.key }}" data-recommended-storage="{{ category.recommended_storage }}" {{ "selected" if category.key == "produce_hard" }}>{{ category.label }}</option>
          {% endfor %}
        </select></div>
      <div class="col-md-4"><label class="form-label small">Місце зберігання</label>
        <select id="storage_location" name="storage_location" class="form-select">
          {% for key, label in storage_locations.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}
        </select></div>
      <div class="col-6 col-md-2"><label class="form-label small">Кількість</label><input name="quantity" type="number" step="any" min="0" class="form-control" required></div>
      <div class="col-6 col-md-2"><label class="form-label small">Одиниця</label>
        <select name="unit" class="form-select"><option>шт</option><option>г</option><option>мл</option></select></div>
      <div class="col-md-4"><label class="form-label small">Придатний до</label><input name="expires_on" type="date" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label small">Відкрито (необов'язково)</label><input name="opened_on" type="date" max="{{ today }}" class="form-control"></div>
      <div class="col-md-4 d-flex align-items-end gap-2">
        <button class="btn btn-primary">Додати</button>
        <button type="button" class="btn btn-outline-secondary" hx-post="/demo" hx-target="#products">Демо-набір</button>
      </div>
    </form>
  </section>

  <section class="card p-3 mb-4">
    <h2 class="h6 mb-3">Холодильник</h2>
    <div id="products">{% include "partials/_products.html" %}</div>
  </section>

  <section class="card p-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h6 mb-0">План на тиждень</h2>
      <button class="btn btn-primary btn-sm" hx-get="/plan" hx-target="#plan">Скласти план</button>
    </div>
    <div id="plan"><p class="text-muted mb-0">Натисніть «Скласти план», щоб отримати сніданки, обіди та вечері на 7 днів.</p></div>
  </section>
</main>
<script>
  const categorySelect = document.getElementById("category");
  const storageSelect = document.getElementById("storage_location");

  function applyRecommendedStorage() {
    const recommended = categorySelect.selectedOptions[0].dataset.recommendedStorage;
    storageSelect.value = recommended;
  }

  categorySelect.addEventListener("change", applyRecommendedStorage);
  applyRecommendedStorage();
</script>
</body>
</html>
